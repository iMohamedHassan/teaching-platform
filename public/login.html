<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1F3B34">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css"><script src="/js/theme.js"></script><title>تسجيل الدخول</title></head>
<body>
<button class="icon-btn" type="button" data-theme-toggle aria-label="تغيير الوضع" style="position:fixed;top:1rem;inset-inline-end:1rem">◐</button>
<div class="auth-wrap"><div class="card auth-card">
  <p class="center"><a class="brand js-brand" href="/">منصتي</a></p>
  <div class="tabs" role="tablist">
    <button type="button" id="tabLogin" role="tab" aria-selected="true">تسجيل الدخول</button>
    <button type="button" id="tabReg" role="tab" aria-selected="false">حساب جديد</button>
  </div>

  <form id="loginForm" novalidate autocomplete="on">
    <label class="field"><span>رقم الموبايل</span><input name="phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="01012345678" required dir="ltr"></label>
    <label class="field"><span>كلمة السر</span><div class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" data-show>إظهار</button></div></label>
    <div class="form-error" id="loginErr" role="alert"></div>
    <button class="btn block" type="submit">دخول</button>
  </form>

  <form id="regForm" hidden novalidate autocomplete="on">
    <label class="field"><span>الاسم ثلاثي</span><input name="name" autocomplete="name" required></label>
    <label class="field"><span>رقم موبايلك</span><input name="phone" type="tel" inputmode="numeric" placeholder="01012345678" required dir="ltr"></label>
    <label class="field"><span>رقم ولي الأمر</span><input name="parentPhone" type="tel" inputmode="numeric" placeholder="01012345678" required dir="ltr"></label>
    <label class="field"><span>السنة الدراسية</span><select name="grade" required><option value="">اختار سنتك</option></select></label>
    <label class="field"><span>كلمة السر</span><div class="pw"><input name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-show>إظهار</button></div><small>8 أحرف على الأقل</small></label>
    <label class="field"><span>تأكيد كلمة السر</span><input name="confirm" type="password" autocomplete="new-password" required></label>
    <div class="form-error" id="regErr" role="alert"></div>
    <button class="btn block" type="submit">إنشاء الحساب</button>
  </form>
</div></div>
<script src="/js/common.js"></script><script src="/js/login.js"></script>
</body></html>
